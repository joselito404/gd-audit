name: "gd-audit"
description: "Audit Godot projects for broken resources, circular autoloads, dead functions, and performance anti-patterns."
author: "jose"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  path:
    description: "Path to Godot project root (directory containing project.godot) or subfolder"
    required: false
    default: "."
  severity:
    description: "Minimum severity to display (info, low, medium, high)"
    required: false
    default: "low"
  fail-on:
    description: "Threshold severity that triggers non-zero exit code (high, medium, never)"
    required: false
    default: "high"
  format:
    description: "Console output format (rich, json, markdown)"
    required: false
    default: "rich"
  ignore-paths:
    description: "Comma-separated or space-separated list of paths/patterns to ignore"
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  step-summary:
    description: "Whether to append a formatted markdown report to GitHub Step Summary"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install gd-audit
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}"

    - name: Run gd-audit
      id: audit
      shell: bash
      run: |
        ARGS=("scan" "${{ inputs.path }}" "--severity" "${{ inputs.severity }}" "--fail-on" "${{ inputs.fail-on }}" "--format" "${{ inputs.format }}")
        
        if [ -n "${{ inputs.ignore-paths }}" ]; then
          ARGS+=("--ignore-paths" "${{ inputs.ignore-paths }}")
        fi

        # If step summary requested and running in GitHub Actions, also generate markdown summary
        if [ "${{ inputs.step-summary }}" = "true" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
          python -m gdaudit.cli scan "${{ inputs.path }}" --format markdown --output "$GITHUB_STEP_SUMMARY" || true
        fi

        # Execute primary scan
        python -m gdaudit.cli "${ARGS[@]}"
