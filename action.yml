name: "gd-audit"
description: "Audit Godot projects for broken resources, circular autoloads, dead functions, and performance anti-patterns."
author: "jose"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  path:
    description: "Path to Godot project root (directory containing project.godot) or subfolder"
    required: false
    default: "."
  severity:
    description: "Minimum severity to display (info, low, medium, high)"
    required: false
    default: "low"
  fail-on:
    description: "Threshold severity that triggers non-zero exit code (high, medium, never)"
    required: false
    default: "high"
  format:
    description: "Console output format (rich, json, markdown)"
    required: false
    default: "rich"
  ignore-paths:
    description: "Comma-separated or space-separated list of paths/patterns to ignore"
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  step-summary:
    description: "Whether to append a formatted markdown report to GitHub Step Summary"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install gd-audit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"

    - name: Run gd-audit
      id: audit
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore-paths }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        ARGS=("scan" "$INPUT_PATH" "--severity" "$INPUT_SEVERITY" "--fail-on" "$INPUT_FAIL_ON" "--format" "$INPUT_FORMAT")
        
        if [ -n "$INPUT_IGNORE_PATHS" ]; then
          ARGS+=("--ignore-paths" "$INPUT_IGNORE_PATHS")
        fi

        # If step summary requested and running in GitHub Actions, also generate markdown summary
        if [ "$INPUT_STEP_SUMMARY" = "true" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
          python -m gdaudit.cli scan "$INPUT_PATH" --format markdown --output "$GITHUB_STEP_SUMMARY" || true
        fi

        # Execute primary scan
        python -m gdaudit.cli "${ARGS[@]}"
