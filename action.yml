name: "gd-audit"
description: "Audit Godot projects for broken resources, circular autoloads, dead functions, and performance anti-patterns."
author: "jose"
branding:
  icon: "check-circle"
  color: "blue"

# -----------------------------------------------------------------------------
# Usage Examples
#
# 1. Via Git repository:
#    - name: Run gd-audit
#      uses: joselito404/gd-audit@v1
#      with:
#        path: "."
#        severity: "low"
#        fail-on: "high"
#        format: "github"
#
# 2. SARIF upload for GitHub Code Scanning:
#    - name: Run gd-audit (SARIF)
#      uses: joselito404/gd-audit@v1
#      with:
#        path: "."
#        format: "sarif"
#        output: "results.sarif"
#        fail-on: "never"
# -----------------------------------------------------------------------------

inputs:
  path:
    description: "Path to Godot project root (directory containing project.godot) or subfolder"
    required: false
    default: "."
  severity:
    description: "Minimum severity to display (info, low, medium, high, critical)"
    required: false
    default: "low"
  fail-on:
    description: "Threshold severity that triggers non-zero exit code (info, low, medium, high, critical, never)"
    required: false
    default: "high"
  format:
    description: "Console output format (rich, json, markdown, github, sarif)"
    required: false
    default: "rich"
  ignore-paths:
    description: "Comma-separated or space-separated list of paths/patterns to ignore"
    required: false
    default: ""
  include-addons:
    description: "Also analyze the addons/ folder at the project root (ignored by default)"
    required: false
    default: "false"
  baseline:
    description: "Path to baseline file to record or filter existing issues"
    required: false
    default: ""
  output:
    description: "Write formatted report output to a file path (e.g. results.sarif)"
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  step-summary:
    description: "Whether to append a formatted markdown report to GitHub Step Summary"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install gd-audit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"

    - name: Run gd-audit
      id: audit
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore-paths }}
        INPUT_INCLUDE_ADDONS: ${{ inputs.include-addons }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        COMMON_ARGS=("--severity" "$INPUT_SEVERITY")
        if [ -n "$INPUT_IGNORE_PATHS" ]; then
          COMMON_ARGS+=("--ignore-paths" "$INPUT_IGNORE_PATHS")
        fi
        if [ "$INPUT_INCLUDE_ADDONS" = "true" ]; then
          COMMON_ARGS+=("--include-addons")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          COMMON_ARGS+=("--baseline" "$INPUT_BASELINE")
        fi

        ARGS=("scan" "$INPUT_PATH" "${COMMON_ARGS[@]}" "--fail-on" "$INPUT_FAIL_ON" "--format" "$INPUT_FORMAT")
        if [ -n "$INPUT_OUTPUT" ]; then
          ARGS+=("--output" "$INPUT_OUTPUT")
        fi

        # If step summary requested and running in GitHub Actions, also generate markdown summary
        if [ "$INPUT_STEP_SUMMARY" = "true" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
          python -m gdaudit.cli scan "$INPUT_PATH" "${COMMON_ARGS[@]}" --format markdown --output "$GITHUB_STEP_SUMMARY" --fail-on never || true
        fi

        # Execute primary scan
        python -m gdaudit.cli "${ARGS[@]}"
